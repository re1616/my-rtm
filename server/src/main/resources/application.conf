# Taskly Server Configuration
# Env vars that can override config values:
#   PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
#   REDIS_HOST, REDIS_PORT
#   JWT_SECRET
#   TASKLY_ENV (dev|prod) — controls JWT_SECRET validation

ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ com.taskly.server.ApplicationKt.module ]
    }
}

taskly {
    # Environment: "dev" (default) or anything else (e.g. "production").
    # Outside dev the server refuses to start with the built-in JWT secret.
    # NB (HOCON): the LAST assignment wins, so defaults go first and the
    # optional ${?ENV} override goes second.
    env = "dev"
    env = ${?TASKLY_ENV}

    database {
        host = "localhost"
        host = ${?PGHOST}
        port = 5432
        port = ${?PGPORT}
        database = "taskly"
        database = ${?PGDATABASE}
        user = "taskly"
        user = ${?PGUSER}
        password = "taskly"
        password = ${?PGPASSWORD}
        poolSize = 10
    }
    redis {
        host = "localhost"
        host = ${?REDIS_HOST}
        port = 6379
        port = ${?REDIS_PORT}
    }
    auth {
        jwtSecret = "taskly-dev-secret-change-in-production-min-256bits!!"
        jwtSecret = ${?JWT_SECRET}
        accessTokenExpiryMinutes = 15
        refreshTokenExpiryDays = 60
    }
    # Public URL of the web app (links in emails)
    appUrl = "http://localhost:5173"
    appUrl = ${?APP_URL}

    # Google Sign-In: OAuth client id; empty disables the endpoint
    googleClientId = ""
    googleClientId = ${?GOOGLE_CLIENT_ID}

    # Outgoing email. Empty host = emails are only logged (dev); required outside dev.
    smtp {
        host = ""
        host = ${?SMTP_HOST}
        port = 587
        port = ${?SMTP_PORT}
        user = ""
        user = ${?SMTP_USER}
        password = ""
        password = ${?SMTP_PASSWORD}
        from = "Taskly <no-reply@taskly.local>"
        from = ${?SMTP_FROM}
    }

    # FCM server key for push notifications (dev default only in dev mode)
    fcmServerKey = ""
    fcmServerKey = ${?FCM_SERVER_KEY}

    # VAPID keys for Web Push (RFC 8292)
    # VAPID_PUBLIC_KEY is the base64-encoded public key (required)
    # VAPID_PRIVATE_KEY is the base64-encoded private key (required outside dev)
    vapidPublicKey = ""
    vapidPublicKey = ${?VAPID_PUBLIC_KEY}
    vapidPrivateKey = ""
    vapidPrivateKey = ${?VAPID_PRIVATE_KEY}

    sync {
        maxBatchSize = 500
    }
    rateLimit {
        # General API: per access token (or per IP when anonymous)
        tokensPerSecond = 100
        tokensPerSecond = ${?RATE_LIMIT_PER_SECOND}
        burstSize = 200
        burstSize = ${?RATE_LIMIT_BURST}
        # /v1/auth/*: per client IP — slows down password guessing
        authTokensPerSecond = 0.2
        authTokensPerSecond = ${?RATE_LIMIT_AUTH_PER_SECOND}
        authBurstSize = 10
        authBurstSize = ${?RATE_LIMIT_AUTH_BURST}
    }
}