# Taskly Server Configuration
ktor {
    deployment {
        port = 8080
        host = "0.0.0.0"
    }
    application {
        modules = [ com.taskly.server.ApplicationKt.module ]
    }
}

taskly {
    database {
        host = ${?PGHOST}
        host = "localhost"
        port = ${?PGPORT}
        port = 5432
        database = ${?PGDATABASE}
        database = "taskly"
        user = ${?PGUSER}
        user = "taskly"
        password = ${?PGPASSWORD}
        password = "taskly"
        poolSize = 10
    }
    redis {
        host = ${?REDIS_HOST}
        host = "localhost"
        port = ${?REDIS_PORT}
        port = 6379
    }
    auth {
        jwtSecret = ${?JWT_SECRET}
        jwtSecret = "taskly-dev-secret-change-in-production-min-256bits!!"
        accessTokenExpiryMinutes = 15
        refreshTokenExpiryDays = 60
    }
    sync {
        maxBatchSize = 500
    }
    rateLimit {
        tokensPerSecond = 100
        burstSize = 200
    }
}