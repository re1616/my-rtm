name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  kotlin:
    name: Shared + Server (Gradle)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskly
          POSTGRES_PASSWORD: taskly
          POSTGRES_DB: taskly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskly"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: taskly_test
      PGUSER: taskly
      PGPASSWORD: taskly
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests (JVM + JS)
        run: ./gradlew :shared:allTests --console=plain
      - name: Server tests (unit + integration on PG/Redis)
        run: ./gradlew :server:test :server:integrationTest --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            shared/build/reports/tests
            server/build/reports/tests
            shared/build/test-results
            server/build/test-results

  web:
    name: Web SPA (Vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
